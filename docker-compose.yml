version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-swiftora-logistics-secret-2024}
      - NODE_ENV=production
    volumes:
      - ./backend/swiftora.db:/app/backend/swiftora.db
    restart: unless-stopped
